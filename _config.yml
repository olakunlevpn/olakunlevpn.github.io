## => Site Settings
##############################
text_skin: dark # "default" (default), "dark", "forest", "ocean", "chocolate", "orange"
highlight_theme: tomorrow-night # "default" (default), "tomorrow", "tomorrow-night", "tomorrow-night-eighties", "tomorrow-night-blue", "tomorrow-night-bright"
url: https://olakunlevpn.github.io
baseurl: ""
title: Olakunle's Blog
description: >-
  Technical blog and notes by Olakunlevpn. Web development, Laravel, PHP,
  JavaScript, cloud, and the things I learn building software.

## => Author and Social
##############################
author:
  type: person
  name: Olakunlevpn
  url: https://olakunle.ng
  avatar: https://github.com/olakunlevpn.png
  bio: Web Developer helping others become one too.
  email: maylancerit@gmail.com
  github: olakunlevpn
  twitter: oxkunle
  linkedin: olakunlevpn

## => GitHub Repository (footer link)
##############################
repository: olakunlevpn/olakunlevpn.github.io
repository_tree: master

## => Paths
##############################
paths:
  root: # title link, default '/'
  home: # home page, default '/'
  archive: # archive page, default '/archive.html'
  rss: # rss feed, default '/feed.xml'

## => Post
##############################
## Excerpt
excerpt_separator: <!--more-->

## Item
paginate: 8
paginate_path: /page:num # don't change this unless you know what you're doing

## => Markdown Enhancements
##############################
## Mathjax
mathjax: false
mathjax_autoNumber: false

## Mermaid
mermaid: false

## Chart
chart: false

## => Sources
##############################
sources: bootcdn # bootcdn (default), unpkg

## => Sharing
##############################
sharing:
  provider: false

## => Comments
##############################
comments:
  provider: false

## => Pageview
##############################
pageview:
  provider: false

## => Search
##############################
search:
  provider: default

## => Jekyll
##############################
lang: en
timezone: Africa/Lagos

remote_theme: kitian616/jekyll-TeXt-theme

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

## Defaults
##############################
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
      sharing: true
      license: false
      aside:
        toc: true
      show_edit_on_github: false
      show_subscribe: true
      pageview: false
  - scope:
      path: ""
      type: pages
    values:
      layout: article
      key: page
      show_title: true
      show_edit_on_github: false
      show_subscribe: false
      pageview: false

## Markdown / kramdown
##############################
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
