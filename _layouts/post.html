---
layout: default
---

<article class="post">

	<header class="post-header">
		<div>
			<span>Posted on </span><span class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</span>
		</div>

		<h1 class="post-title">{{ page.title }}</h1>
	</header>

	<div class="entry-content">
		{{ content }}
	</div>

</article>

<div id="post-nav">
	<div class="next">
		{% if page.next.url %}
		<a href="{{ site.baseurl }}{{ page.next.url }}">
			<span>Next entry</span>
			{{ page.next.title }}
		</a>
		{% endif %}
	</div>

	<div class="previous">
		{% if page.previous.url %}
		<a href="{{ site.baseurl }}{{ page.previous.url }}">
			<span>Previous entry</span>
			{{ page.previous.title }}
		</a>
		{% endif %}
	</div>
</div>
